# One hangar instance: a headless Android 14 (redroid) and the La Pluma MAA web
# console connected to it. Its settings are data/<instance>/instance.env, which
# `./hangar` passes in. Plain `docker compose` in this directory reads .env, a
# link to data/main/instance.env (its COMPOSE_FILE adds compose.adb.yaml when adb
# is published); for another instance add `--env-file data/<instance>/instance.env`.
name: rhodes-hangar-${HANGAR_INSTANCE:?}
services:
  android:
    image: local/rhodes-hangar-redroid:14-avd34-c2
    pull_policy: never
    privileged: true
    # Contain a runaway guest (2026-11-19: a crash_dump32 storm filled the host's 24 CPUs).
    # pids counts threads; Android with the game running peaks near 1400.
    pids_limit: 4096
    # --cpus (default 8). Software rendering (--gpu-node none) needs more: the game
    # draws on these CPUs.
    cpus: ${HANGAR_CPUS:-8}
    volumes:
      - ./data/${HANGAR_INSTANCE:?}/android:/data
    command:
      - ro.enable.native.bridge.exec=0
      - androidboot.use_memfd=1
      - androidboot.redroid_width=1280
      - androidboot.redroid_height=720
      - androidboot.redroid_dpi=240
      - androidboot.redroid_fps=30
      # host: render on ${HANGAR_GPU_NODE}; guest: software rendering (--gpu-node none).
      # Files from before software rendering lack the mode: they render on the GPU.
      - androidboot.redroid_gpu_mode=${HANGAR_GPU_MODE:-host}
      - androidboot.redroid_gpu_node=${HANGAR_GPU_NODE:?}

  la-pluma:
    image: miaona/la-pluma@sha256:fa18e088eea026cc52fcd4951e05ee6a16c2272f5cdfd7ff89677973d487b29c
    depends_on:
      - android
    ports:
      # Listen address from --bind (default localhost).
      - "${HANGAR_BIND:-127.0.0.1}:${HANGAR_WEB_PORT:?}:3000"
    environment:
      ADB_ADDRESS: android:5555
      # Official or Bilibili: the client MAA starts and operates by default.
      MAA_CLIENT_TYPE: ${HANGAR_CLIENT_TYPE:?}
      LA_PLUMA_TOKEN: ${LA_PLUMA_TOKEN:?}
      # The live preview's TURN relay, as browsers are told of it. With --public-ip:
      # the shared coturn (relay.compose.yaml) at that address, UDP 3478, which
      # knows this instance by the user and password below. Without: La Pluma's own
      # relay at the container's address, which only this host reaches.
      LA_PLUMA_WEBRTC_TURN_PUBLIC_IP: ${HANGAR_PUBLIC_IP:-}
      LA_PLUMA_WEBRTC_TURN_PORT: "3478"
      LA_PLUMA_WEBRTC_TURN_USERNAME: hangar-${HANGAR_INSTANCE}
      LA_PLUMA_WEBRTC_TURN_PASSWORD: ${HANGAR_TURN_PASSWORD:?run ./hangar deploy to upgrade this instance}
    volumes:
      - ./data/${HANGAR_INSTANCE}/la-pluma/data:/app/data
      # maa-cli settings: profiles/default.toml holds the connection to android:5555.
      - ./data/${HANGAR_INSTANCE}/la-pluma/maa-config:/root/.config/maa
      # MaaCore and resources, installed by the image on first start.
      - ./data/${HANGAR_INSTANCE}/la-pluma/maa-data:/root/.local/share/maa
